<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pi Camera Stream</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body class="stream-page">
    <div class="stream-layout">
        <div class="video-panel">
            <!-- src comes from /api/config (VIDEO_URL on the server) -->
            <iframe id="camera" class="camera-frame" allow="autoplay">
            </iframe>
        </div>
        <section class="controls" aria-label="Movement controls">
            <h2>Movement</h2>
            <div class="d-pad">
                <button type="button" data-command="rotate-left" aria-label="Rotate left">&#8634;</button>
                <button type="button" data-command="forward" aria-label="Move forward">&#8593;</button>
                <button type="button" data-command="rotate-right" aria-label="Rotate right">&#8635;</button>
                <button type="button" data-command="left" aria-label="Move left">&#8592;</button>
                <button type="button" data-command="back" aria-label="Move back">&#8595;</button>
                <button type="button" data-command="right" aria-label="Move right">&#8594;</button>
            </div>
            <p id="control-status">Ready</p>
        </section>

    </div>

    <div>
        <section class="ping-stats">
            <table>
                <thead><tr><th>Name</th><th>Avg (ms)</th></tr></thead>
                <tbody id="times"></tbody>
            </table>
        </section>

        <section class="sightings" aria-label="Face recognition">
            <h2>Recognized</h2>
            <p id="faces-status">Face service not connected</p>
            <ul id="faces-present"></ul>
            <h3>Recent</h3>
            <ul id="faces-log"></ul>
        </section>
    </div>

    <script>
        const PLAYER_OPTS = "controls=false&muted=true&autoplay=true&playsinline=true";

        async function loadVideo() {
            let url = "http://192.168.0.196:8889/cam";
            try {
                url = (await (await fetch("/api/config")).json()).video_url || url;
            } catch {}
            document.getElementById("camera").src = `${url}${url.includes("?") ? "&" : "?"}${PLAYER_OPTS}`;
        }

        loadVideo();

        const controlStatus = document.getElementById("control-status");

        async function sendControl(command) {
            controlStatus.textContent = `Sending: ${command}`;
            try {
                const response = await fetch("/api/control", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ command })
                });
                const result = await response.json();
                controlStatus.textContent = result.ok
                    ? `Command sent: ${command}`
                    : `Control unavailable: ${result.error}`;
            } catch {
                controlStatus.textContent = "Control unavailable";
            }
        }

        document.querySelectorAll("[data-command]").forEach((button) => {
            button.addEventListener("click", () => sendControl(button.dataset.command));
        });

        document.addEventListener("keydown", (event) => {
            const commands = {
                ArrowUp: "forward",
                ArrowDown: "back",
                ArrowLeft: "left",
                ArrowRight: "right",
                q: "rotate-left",
                e: "rotate-right"
            };
            const command = commands[event.key];
            if (command) {
                event.preventDefault();
                sendControl(command);
            }
        });

        async function loadPingTimes() {
            const times = await (await fetch("/api/stats")).json();
            document.getElementById("times").innerHTML = times
            .map(t => `<tr><td>${t.name}</td><td>${t.time}</td></tr>`)
            .join("");
        }

        loadPingTimes();
        setInterval(loadPingTimes, 100); // refreshes n milliseconds

        const escapeHtml = (s) => String(s).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`);

        async function loadSightings() {
            const status = document.getElementById("faces-status");
            let s;
            try {
                s = await (await fetch("/api/sightings", { cache: "no-store" })).json();
            } catch {
                status.textContent = "Dashboard server unreachable";
                return;
            }
            if (s.age_ms === null) {
                status.textContent = "Face service not connected";
            } else if (s.age_ms > 5000) {
                status.textContent = `Face service offline (last update ${Math.round(s.age_ms / 1000)}s ago)`;
            } else if (!s.signal) {
                status.textContent = "No video from drone";
            } else {
                status.textContent = `${s.present.length} face(s) in view`;
            }
            const live = s.age_ms !== null && s.age_ms <= 5000;
            document.getElementById("faces-present").innerHTML = (live ? s.present : [])
                .map(p => `<li class="${p.name === "Unknown" ? "unknown" : "known"}">${escapeHtml(p.name)}` +
                          ` <span class="track">#${p.track}</span></li>`)
                .join("");
            document.getElementById("faces-log").innerHTML = s.log.slice(0, 10)
                .map(e => `<li><span class="time">${new Date(e.time).toLocaleTimeString()}</span> ` +
                          `${escapeHtml(e.name)} ${e.event}` +
                          `${e.event === "left" ? ` after ${Math.round(e.duration_s)}s` : ""}</li>`)
                .join("");
        }

        loadSightings();
        setInterval(loadSightings, 500);
    </script>
</body>

</html>
